name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build all crates
        run: |
          cargo build -p summit-core
          cargo build -p summit-services
          cargo build -p summit-api
          cargo build -p libsummit
          cargo build -p summitd
          cargo build -p summit-ctl

      - name: Run unit tests
        run: cargo test --workspace --lib

  # Two real daemons over a veth pair in disposable network namespaces,
  # with fault injection (loss, blackouts, link down, multicast filtering).
  # No sudo inside the suite; sudo here only relaxes the runner's sandbox.
  integration:
    name: Integration (rootless netns)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare runner
        run: |
          # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # The cloud kernel ships netem in linux-modules-extra.
          sudo modprobe sch_netem || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
          # Unprivileged namespaces can't autoload modules: preload them.
          for m in veth ip6_tables ip6table_filter nf_tables nft_compat \
                   xt_statistic ip6t_frag; do
            sudo modprobe "$m" || echo "warning: module $m unavailable"
          done
          sudo apt-get install -y socat jq
          unshare -r -n true   # fail fast if namespaces are still blocked

      - name: Integration suite
        run: scripts/integration-rootless.sh -- --test-threads=1

      - name: Android smoke script dry run (fake phone)
        run: |
          scripts/android-smoke-dryrun.sh
          scripts/android-smoke-dryrun.sh --filter-multicast

  # Compile + unit-test on the other desktop OSes. Real networking is only
  # exercised on Linux (integration suite) and on hardware (android-smoke.sh).
  portability:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build daemon and CLI
        run: cargo build -p summitd -p summit-ctl
      - name: Unit tests
        run: cargo test --workspace --lib --no-fail-fast

  android:
    name: Build (Android arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cross-compile with the runner's NDK
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-android.sh

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
