[package]
name = "summit-ctl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow     = { workspace = true }
# Only ever talks plain HTTP to the local daemon: no TLS stack (keeps
# aws-lc-sys/cmake out of cross builds for Android/Windows/macOS) and no
# system proxy lookup (a proxy env var must not hijack 127.0.0.1 calls).
reqwest    = { version = "0.13.2", default-features = false, features = ["json", "multipart"] }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
